<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice Translator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <h1>Voice Translator</h1>
      <p class="subtitle">Speak in one language. Hear it in another.</p>

      <div class="language-panel">
        <div class="lang-box">
          <label>🎤 Input Language</label>
          <select id="inputLang">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="mr">Marathi</option>
            <option value="gu">Gujarati</option>
            <option value="fr">French</option>
          </select>
        </div>

        <div class="lang-box">
          <label>🔊 Output Language</label>
          <select id="outputLang">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="mr">Marathi</option>
            <option value="gu">Gujarati</option>
            <option value="fr">French</option>
          </select>
        </div>
      </div>

      <button id="recordBtn" class="idle">🎙 Start Recording</button>

      <div id="status" class="status idle">Idle</div>

      <div class="output-box">
        <div class="speech-row">
          <h3>Recognized Speech</h3>
          <button id="playInput" class="speaker-btn" disabled>🔊</button>
        </div>
        <p id="recognizedText">—</p>

        <div class="speech-row">
          <h3>Translated Speech</h3>
          <button id="playOutput" class="speaker-btn" disabled>🔊</button>
        </div>
        <p id="translatedText">—</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
